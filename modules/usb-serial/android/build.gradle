plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ubxmobile.usbserial'
version = '0.1.0'

android {
  namespace "com.ubxmobile.usbserial"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  maven { url 'https://jitpack.io' }
}

dependencies {
  // Drivers for CDC-ACM, FTDI, CP210x, PL2303 and CH34x (technical spec §5.2).
  implementation 'com.github.mik3y:usb-serial-for-android:3.10.0'
}
